# Selah, the whole stack on one machine: `docker compose up --build`.
# Every port is bound to 127.0.0.1 so nothing is exposed to the network.
# Secrets come from .env (copy .env.example); never commit .env.

name: selah

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: selah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SELAH_OWNER_PASSWORD: ${SELAH_OWNER_PASSWORD:?set in .env}
      SELAH_APP_PASSWORD: ${SELAH_APP_PASSWORD:?set in .env}
      SELAH_AUTH_PASSWORD: ${SELAH_AUTH_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d selah"]
      interval: 5s
      retries: 20

  # S3-compatible private object storage. (MinIO's community image is no
  # longer published on Docker Hub, so the stack uses RustFS; any S3 store works.)
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes: [storage-data:/data]
    ports: ["127.0.0.1:9000:9000"]

  # Virus scanner for uploads; the web app refuses uploads while it is down.
  # clamd holds the signature database in memory:
  # give the host at least 3 GiB free for it (4 GiB preferred), because a
  # signature reload briefly doubles that. Limits sit above the 20 MB upload
  # cap so nothing is waved through for being "too big to scan".
  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMD_CONF_StreamMaxLength: 25M
      CLAMD_CONF_MaxFileSize: 25M
      CLAMD_CONF_MaxScanSize: 100M
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_AlertOLE2Macros: "yes"
    volumes: [clamav-db:/var/lib/clamav]
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s

  # Draws PDF exports: Chromium in its own container (Gotenberg), apart from
  # the web app, like the virus scanner. JavaScript is off, downloads and
  # webhooks are off, and it sits on an internal network with no route out,
  # so it can only render the HTML and fonts the web app sends it. No port is
  # published. The web app refuses PDF exports while it is down.
  pdf:
    image: gotenberg/gotenberg:8.38.1-chromium
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --chromium-max-queue-size=10
      - --api-disable-download-from=true
      - --webhook-disable=true
      - --pdfengines-disable-routes=true
      - --prometheus-disable-collect=true
      - --api-timeout=60s
      - --log-level=warn
    networks: [pdf]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  ollama:
    image: ollama/ollama:0.40.6
    volumes: [ollama-models:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    # For an NVIDIA GPU, uncomment:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  # Pulls the models once into the ollama volume. The chat model only when it
  # runs here: with a hosted LLM_PROVIDER, LLM_MODEL names the API's model.
  ollama-pull:
    image: ollama/ollama:0.40.6
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint:
      - sh
      - -c
      - ollama pull ${EMBED_MODEL:-bge-m3} && if [ "${LLM_PROVIDER:-ollama}" = ollama ]; then ollama pull ${LLM_MODEL:-qwen3:4b}; fi
    depends_on: [ollama]
    restart: "no"

  ai:
    build: ./services/ai
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set in .env}
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on: [ollama]
    ports: ["127.0.0.1:8000:8000"]

  # One-shot: migrations as the schema owner, then the private bucket.
  setup:
    build: { context: ./apps/web, target: tools }
    command: ["sh", "-c", "npm run db:migrate && npm run storage:init"]
    environment:
      DATABASE_OWNER_URL: postgres://selah_owner:${SELAH_OWNER_PASSWORD}@db:5432/selah
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    restart: "no"

  web:
    build: { context: ./apps/web, target: runner }
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_APP_URL: postgres://selah_app:${SELAH_APP_PASSWORD}@db:5432/selah
      DATABASE_AUTH_URL: postgres://selah_auth:${SELAH_AUTH_PASSWORD}@db:5432/selah
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      # Names are masked before anything reaches a hosted model (docs/assistant.md).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AI_MASKING: ${AI_MASKING:-auto}
      CLAMD_HOST: clamav
      PDF_SERVICE_URL: http://pdf:3000
    depends_on:
      clamav: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
      ai: { condition: service_started }
      pdf: { condition: service_started }
    networks: [default, pdf]
    ports: ["127.0.0.1:3000:3000"]

  # Sends queued mail through the server's relay, waking on each new mail.
  mail:
    build: { context: ./apps/web, target: tools }
    command: ["npm", "run", "job:mail", "--", "--watch"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_OWNER_URL: postgres://selah_owner:${SELAH_OWNER_PASSWORD}@db:5432/selah
      SMTP_URL: ${SMTP_URL:?set in .env}
      MAIL_FROM: ${MAIL_FROM:?set in .env}
    depends_on:
      setup: { condition: service_completed_successfully }
    restart: unless-stopped

  # The scheduled jobs (apps/web/scripts/jobs.sh): assistant indexing every
  # two minutes, reminders and retention purges daily, metrics monthly.
  jobs:
    build: { context: ./apps/web, target: tools }
    command: ["sh", "scripts/jobs.sh"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_OWNER_URL: postgres://selah_owner:${SELAH_OWNER_PASSWORD}@db:5432/selah
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    depends_on:
      setup: { condition: service_completed_successfully }
      ai: { condition: service_started }
    restart: unless-stopped

networks:
  # No route out: only the web app reaches the PDF renderer, and it reaches nothing.
  pdf:
    internal: true

volumes:
  db-data:
  storage-data:
  ollama-models:
  clamav-db:
