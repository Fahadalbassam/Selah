# Selah, the whole stack on one machine: `docker compose up --build`.
# Every port is bound to 127.0.0.1 so nothing is exposed to the network.
# Secrets come from .env (copy .env.example); never commit .env.

name: selah

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: selah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SELAH_OWNER_PASSWORD: ${SELAH_OWNER_PASSWORD:?set in .env}
      SELAH_APP_PASSWORD: ${SELAH_APP_PASSWORD:?set in .env}
      SELAH_AUTH_PASSWORD: ${SELAH_AUTH_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d selah"]
      interval: 5s
      retries: 20

  # S3-compatible private object storage. (MinIO's community image is no
  # longer published on Docker Hub, so the stack uses RustFS; any S3 store works.)
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
    volumes: [storage-data:/data]
    ports: ["127.0.0.1:9000:9000"]

  # Virus scanner for uploads. The web app refuses uploads while it is down.
  # Needs about 1.5 GB of RAM once its signatures are loaded.
  clamav:
    image: clamav/clamav:1.5.4
    volumes: [clamav-db:/var/lib/clamav]
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s

  ollama:
    image: ollama/ollama:0.40.6
    volumes: [ollama-models:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]
    # For an NVIDIA GPU, uncomment:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  # Pulls the models once into the ollama volume.
  ollama-pull:
    image: ollama/ollama:0.40.6
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3} && ollama pull ${LLM_MODEL:-qwen3:4b}"]
    depends_on: [ollama]
    restart: "no"

  ai:
    build: ./services/ai
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set in .env}
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on: [ollama]
    ports: ["127.0.0.1:8000:8000"]

  # One-shot: migrations as the schema owner, then the private bucket.
  setup:
    build: { context: ./apps/web, target: tools }
    command: ["sh", "-c", "npm run db:migrate && npm run storage:init"]
    environment:
      DATABASE_OWNER_URL: postgres://selah_owner:${SELAH_OWNER_PASSWORD}@db:5432/selah
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    restart: "no"

  web:
    build: { context: ./apps/web, target: runner }
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_APP_URL: postgres://selah_app:${SELAH_APP_PASSWORD}@db:5432/selah
      DATABASE_AUTH_URL: postgres://selah_auth:${SELAH_AUTH_PASSWORD}@db:5432/selah
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      CLAMD_HOST: clamav
    depends_on:
      clamav: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
      ai: { condition: service_started }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  db-data:
  storage-data:
  ollama-models:
  clamav-db:
