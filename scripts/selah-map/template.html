<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selah map</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#5c6773; --line:#d9dee5; --soft:#eef1f5;
  --node:#3b4a63; --node-sub:#7b8aa3; --root:#1b2430; --root-ink:#fff; --halo:#f5b301; --accent:#2457d6;
  --dim:.14; --shadow:0 6px 24px rgba(20,30,50,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --panel:#171e28; --ink:#e6ebf2; --muted:#9aa6b5; --line:#2b3544; --soft:#1e2733;
    --node:#9db2d4; --node-sub:#6f84a6; --root:#e6ebf2; --root-ink:#10151c; --halo:#ffd23f; --accent:#7aa2ff;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --panel:#171e28; --ink:#e6ebf2; --muted:#9aa6b5; --line:#2b3544; --soft:#1e2733;
  --node:#9db2d4; --node-sub:#6f84a6; --root:#e6ebf2; --root-ink:#10151c; --halo:#ffd23f; --accent:#7aa2ff;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Tahoma,system-ui,-apple-system,"Noto Sans Arabic",Arial,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 0 0 6px;white-space:nowrap}
[dir=rtl] header h1{margin:0 6px 0 0}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#results{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:20;max-height:340px;overflow:auto;display:none}
#results button{display:block;width:100%;text-align:start;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:6px 10px}
#results small{display:block;color:var(--muted);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:230px 1fr 380px}
aside{background:var(--panel);overflow:auto;padding:12px 14px}
#layers{border-inline-end:1px solid var(--line)}
#panel{border-inline-start:1px solid var(--line)}
aside h2{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
aside h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;user-select:none}
.row input{margin:0}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.sw.line{height:4px;border-radius:2px;width:18px}
.row .n{margin-inline-start:auto;color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:12px;margin:8px 0}
#stage{position:relative;overflow:hidden;background:var(--bg);touch-action:none;direction:ltr}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#svg.drag{cursor:grabbing}
#zoomctl{position:absolute;inset-inline-start:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;direction:ltr}
#zoomctl button{width:34px;height:34px;padding:0;font-size:18px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;max-width:340px;font-size:12.5px;display:none;box-shadow:var(--shadow)}
#tip b{display:block;margin-bottom:2px}
.lbl{font-size:12.5px;fill:var(--ink);unicode-bidi:plaintext;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.lbl.sub{font-size:11.5px;fill:var(--muted)}
.edge{fill:none;stroke-linecap:round}
.hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.nd{cursor:pointer}
.chip text{font-size:7.5px;fill:#fff;text-anchor:middle;pointer-events:none;font-weight:700}
.chip{cursor:pointer}
.dim{opacity:var(--dim)}
.pn{padding:0}
#panel .empty{color:var(--muted)}
#panel h3{font-size:18px;margin:0 0 2px}
#panel .idline{color:var(--muted);font-size:12px;direction:ltr;text-align:start}
#panel p{margin:8px 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge{border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);background:var(--soft)}
.badge.risk{background:#fde8e6;border-color:#f0b4ae;color:#8a1c12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.risk{background:#3b1d1a;border-color:#7a3a33;color:#ffb4aa}}
.careful{border:1px solid #f0b4ae;background:#fff4f2;color:#7a1a10;border-radius:10px;padding:8px 10px;margin:10px 0;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .careful{background:#2c1815;border-color:#7a3a33;color:#ffb4aa}}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
section.s{border-inline-start:4px solid var(--line);padding-inline-start:10px;margin:12px 0}
section.s>h4{margin:0 0 4px;font-size:13px}
details>summary{cursor:pointer;font-weight:600;font-size:13px}
details.s2{margin:8px 0;border-inline-start:4px solid var(--line);padding-inline-start:10px}
ul.paths{list-style:none;margin:6px 0;padding:0}
ul.paths li{margin:2px 0}
code.p{direction:ltr;unicode-bidi:isolate;display:inline-block;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--soft);border-radius:5px;padding:0 5px;cursor:copy;word-break:break-all;text-align:left}
.tag{font-size:11px;border-radius:999px;background:#8d6e0b22;color:var(--muted);padding:0 6px;margin-inline-start:4px;white-space:nowrap}
.conn{display:block;width:100%;text-align:start;margin:4px 0;padding:6px 8px}
.conn .k{display:inline-block;border-radius:999px;color:#fff;font-size:11px;padding:0 8px;margin-inline-end:6px}
.conn small{display:block;color:var(--muted)}
a{color:var(--accent)}
.rules a{display:block;margin:2px 0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:start}
footer{padding:4px 14px;font-size:11.5px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
@media (max-width:980px){
  body{display:block;height:auto}
  main{display:flex;flex-direction:column}
  #stage{height:62vh;order:1}
  #panel{order:2}
  #layers{order:3}
  aside{border:0!important}
}
</style>
</head>
<body>
<header>
  <h1 id="ttl"></h1>
  <div class="search"><input id="q" type="search" autocomplete="off"><div id="results"></div></div>
  <button id="bFit"></button>
  <button id="bCollapse"></button>
  <button id="bExpand"></button>
  <button id="bClear"></button>
  <span class="spacer"></span>
  <button id="bTheme" title="light / dark">◐</button>
  <button id="bLang"></button>
</header>
<main>
  <aside id="layers"></aside>
  <div id="stage">
    <svg id="svg" role="img"><g id="world"></g></svg>
    <div id="zoomctl"><button id="zin" aria-label="+">+</button><button id="zout" aria-label="-">−</button></div>
  </div>
  <aside id="panel"></aside>
</main>
<footer id="foot"></footer>
<div id="tip"></div>

    layer:{fe:'Frontend',be:'Backend',db:'Database',perm:'Permissions',ai:'AI',job:'Jobs and mail',test:'Tests',risk:'Risk flags',shared:'Shared files'},
    kind:{data:'data',permission:'permission',ai:'AI call',job:'job',scan:'scan',shared:'shared file',tree:'part of'},
    risks:{privacy:'privacy',permissions:'permissions',ai:'AI',migration:'migration'},
    roleNames:{firm_admin:'firm_admin',consultant:'consultant',client_admin:'client_admin',client_manager:'client_manager',action_owner:'action_owner'},
    ruleLabels:{'CLAUDE.md':'CLAUDE.md: change rules, reviews, migrations','docs/rules.md':'Product rules (docs/rules.md)','docs/ui-guidelines.md':'UI guidelines','docs/authorization.md':'Who sees what (authorization)','docs/assistant.md':'Assistant, masking, number scanner','docs/security.md':'Security','docs/data-architecture.md':'Data architecture','docs/handoff.md':'How it is built','docs/operations.md':'Operations','docs/system-map.md':'System map (the source of this page)'}
  }
};
const LAYERS = [
  {id:'fe',color:'#0d9ad6'},{id:'be',color:'#5a5fd6'},{id:'db',color:'#d98a00'},{id:'perm',color:'#9b45c9'},
  {id:'ai',color:'#17a673'},{id:'job',color:'#e0642a'},{id:'test',color:'#64748b'},{id:'risk',color:'#d92d20'},{id:'shared',color:'#8a6d3b'}
];
const KINDS = [
  {id:'data',color:'#2f7de1',dash:''},{id:'permission',color:'#9b45c9',dash:'6 3'},{id:'ai',color:'#17a673',dash:'2 3'},
  {id:'job',color:'#e0642a',dash:'9 3 2 3'},{id:'scan',color:'#d6336c',dash:'1 4'},{id:'shared',color:'#8a6d3b',dash:'4 4'}
];
const KIND_OF = {'data':'data','permission':'permission','AI call':'ai','job':'job','scan':'scan','shared file':'shared'};
const LC = Object.fromEntries(LAYERS.map(l=>[l.id,l.color]));
const KC = Object.fromEntries(KINDS.map(k=>[k.id,k]));
const RULES_BASE = ['CLAUDE.md','docs/rules.md','docs/ui-guidelines.md'];
const RULES_BY_RISK = {privacy:['docs/security.md'],permissions:['docs/authorization.md'],ai:['docs/assistant.md'],migration:['docs/data-architecture.md','docs/handoff.md']};
const UNIVERSAL = 10; // a shared file used by this many features or more is "almost everyone's"

/* ---------- data prep ---------- */
const nodes = D.nodes; const byId = new Map(nodes.map(n=>[n.id,n]));
const rootOf = (id)=>{const n=byId.get(id);return n.parent?n.parent:n.id;};
const kids = {}; nodes.forEach(n=>{if(n.parent)(kids[n.parent]=kids[n.parent]||[]).push(n.id);});
const sharedByFile = new Map(D.shared.map(r=>[r.file,r]));
const sharedByFeature = {}; D.shared.forEach(r=>r.features.forEach(f=>(sharedByFeature[f]=sharedByFeature[f]||[]).push(r)));
// declared links, one edge per bullet
const links = []; nodes.forEach(n=>n.links.forEach(l=>links.push({id:'L'+links.length,from:n.id,to:l.to,kind:KIND_OF[l.kind],files:l.files,flow:l.flow})));
// pair counts through shared files used by fewer than UNIVERSAL features
const pairs = {};
D.shared.forEach(r=>{ if(r.features.length>=UNIVERSAL||r.features.length<2) return;
  for(let i=0;i<r.features.length;i++)for(let j=i+1;j<r.features.length;j++){const a=r.features[i],b=r.features[j];const k=a<b?a+'|'+b:b+'|'+a;(pairs[k]=pairs[k]||[]).push(r.file);} });
const AI_RE=/(assistant|\/ai[-\/]|ai-|masking|sensitive-numbers|arabic-fold|retrieval|translations|document-summar|client-ai|embed|services\/ai\/)/i;
const JOB_RE=/(\/jobs\/|mail|notification|outbound|reminder|digest|schedule|scripts\/jobs)/i;
const PERM_RE=/(authz\/|rls|privacy|leak|audience|observer|restricted|hidden|reader|definer)/i;
function layerItems(n){
  const L=n.lists, all=[].concat(L.api,L.services,L.lib,L.jobs,L.extra_files);
  return {
    fe:[].concat(L.pages,L.components),
    be:[].concat(L.api,L.services,L.lib,L.extra_files),
    db:[].concat(n.tables.map(t=>'table '+t),L.migrations),
    perm:[].concat(n.policy.map(p=>'policy '+p),all.filter(p=>/authz\//.test(p)),L.migrations.filter(p=>PERM_RE.test(p))),
    ai:[].concat(all.concat(L.tests).filter(p=>AI_RE.test(p)),n.tables.filter(t=>/^ai_|client_ai|content_translations/.test(t)).map(t=>'table '+t)),
    job:[].concat(L.jobs,all.filter(p=>JOB_RE.test(p)&&!L.jobs.includes(p))),
    test:[].concat(L.tests),
    risk:n.risk.slice(),
    shared:(sharedByFeature[rootOf(n.id)]||[]).map(r=>r.file)
  };
}
const LI = new Map(nodes.map(n=>[n.id,layerItems(n)]));

/* ---------- state ---------- */
const S = {lang:'ar', layers:new Set(), kinds:new Set(KINDS.map(k=>k.id)), sel:null, view:null, collapsed:new Set(), q:'', min:5, theme:null};
function readHash(){
  const p=new URLSearchParams(location.hash.replace(/^#/,''));
  const g=(k)=>p.get(k);
  if(g('lang')==='en'||g('lang')==='ar') S.lang=g('lang');
  if(p.has('l')) S.layers=new Set(g('l').split(',').filter(x=>LC[x]));
  if(p.has('e')) S.kinds=new Set(g('e').split(',').filter(x=>KC[x]));
  S.sel=null;
  if(g('n')&&byId.has(g('n'))) S.sel={t:'n',id:g('n')};
  else if(g('x')) S.sel={t:'e',id:g('x')};
  S.view=(g('v')==='conn'||g('v')==='conf')?g('v'):null;
  if(p.has('c')) S.collapsed=new Set(g('c').split(',').filter(x=>kids[x]));
  S.q=g('q')||'';
  if(g('m')) S.min=Math.max(2,Math.min(9,parseInt(g('m'))||5));
}
function writeHash(){
  const p=new URLSearchParams();
  if(S.sel) p.set(S.sel.t==='n'?'n':'x',S.sel.id);
  if(S.layers.size) p.set('l',[...S.layers].join(','));
  p.set('e',[...S.kinds].join(','));
  if(S.view) p.set('v',S.view);
  if(S.collapsed.size) p.set('c',[...S.collapsed].join(','));
  if(S.q) p.set('q',S.q);
  if(S.min!==5) p.set('m',S.min);
  p.set('lang',S.lang);
  const h='#'+p.toString();
  if(h!==location.hash) history.replaceState(null,'',h);
}

/* ---------- layout ---------- */
const R1=300,R2=500,SUBSTEP=0.115;
const pos=new Map();
(function layout(){
  const tops=nodes.filter(n=>!n.parent);
  tops.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/tops.length;pos.set(n.id,{a,r:R1,x:Math.cos(a)*R1,y:Math.sin(a)*R1});});
  Object.keys(kids).forEach(pid=>{
    const pa=pos.get(pid).a, ks=kids[pid];
    ks.forEach((k,i)=>{const a=pa+(i-(ks.length-1)/2)*SUBSTEP;pos.set(k,{a,r:R2,x:Math.cos(a)*R2,y:Math.sin(a)*R2});});
  });
})();
const visible=(id)=>{const n=byId.get(id);return !(n.parent&&S.collapsed.has(n.parent));};
const vis=(id)=>visible(id)?id:byId.get(id).parent; // where an edge ends when the node is folded away

/* ---------- derived highlight sets ---------- */
function neighbours(id){
  const set=new Set([id]);
  links.forEach(l=>{if(l.from===id)set.add(l.to);if(l.to===id)set.add(l.from);});
  const r=rootOf(id); Object.keys(pairs).forEach(k=>{const [a,b]=k.split('|');if(a===r)set.add(b);if(b===r)set.add(a);});
  return set;
}
function conflictsOf(id){
  const r=rootOf(id);
  const rows=(sharedByFeature[r]||[]).slice();
  const normal=rows.filter(x=>x.features.length<UNIVERSAL), every=rows.filter(x=>x.features.length>=UNIVERSAL);
  const partners={}; normal.forEach(x=>x.features.forEach(f=>{if(f!==r)(partners[f]=partners[f]||[]).push(x.file);}));
  return {normal,every,partners};
}
function focusSets(){
  const nodesF=new Set(), edgesF=new Set(); let active=false;
  const q=S.q.trim().toLowerCase();
  if(q){active=true; matches(q).forEach(m=>nodesF.add(m.id));}
  if(S.sel&&S.sel.t==='n'){
    const id=S.sel.id;
    if(S.view==='conn'){active=true; neighbours(id).forEach(x=>nodesF.add(x)); links.forEach(l=>{if(l.from===id||l.to===id)edgesF.add(l.id);}); const r=rootOf(id);Object.keys(pairs).forEach(k=>{const[a,b]=k.split('|');if(a===r||b===r)edgesF.add('S:'+k);});}
    else if(S.view==='conf'){active=true; nodesF.add(id); const c=conflictsOf(id); Object.keys(c.partners).forEach(f=>nodesF.add(f)); const r=rootOf(id); Object.keys(c.partners).forEach(f=>edgesF.add('S:'+(r<f?r+'|'+f:f+'|'+r)));}
    else {nodesF.add(id); links.forEach(l=>{if(l.from===id||l.to===id)edgesF.add(l.id);});}
  } else if(S.sel&&S.sel.t==='e'){
    const e=edgeById(S.sel.id); if(e){edgesF.add(e.id);nodesF.add(e.from);nodesF.add(e.to);}

}

/* ---------- edges ---------- */
function edgeById(id){
  if(id.startsWith('S:')){const [a,b]=id.slice(2).split('|');const f=pairs[id.slice(2)];if(!f)return null;return {id,from:a,to:b,kind:'shared',files:f,flow:null,pair:true};}
  return links.find(l=>l.id===id)||null;
}
function currentEdges(){
  const out=[];
  links.forEach(l=>{ if(S.kinds.has(l.kind)||(S.sel&&S.sel.t==='e'&&S.sel.id===l.id)) out.push(l); });
  const forced = S.view? true:false;
  Object.keys(pairs).forEach(k=>{const [a,b]=k.split('|'); const n=pairs[k].length;
    const show = (S.layers.has('shared')&&n>=S.min) || (S.sel&&S.sel.t==='e'&&S.sel.id==='S:'+k) ||
      (forced&&S.sel&&S.sel.t==='n'&&(rootOf(S.sel.id)===a||rootOf(S.sel.id)===b)&&(S.view==='conf'||n>=S.min));
    if(show) out.push({id:'S:'+k,from:a,to:b,kind:'shared',files:pairs[k],flow:null,pair:true});});
  return out;
}

/* ---------- search ---------- */
function nodeText(n){return [n.id,n.name.en,n.name.ar,n.summary.en,n.summary.ar,n.roles,n.tables.join(' '),n.policy.join(' ')].join(' ').toLowerCase();}
function matches(q){
  const res=[]; const ql=q.toLowerCase();
  nodes.forEach(n=>{
    let why=null;
    if([n.id,n.name.en,n.name.ar].join(' ').toLowerCase().includes(ql)) why='';
    else if(nodeText(n).includes(ql)) why=(n.tables.concat(n.policy).find(x=>x.toLowerCase().includes(ql))||n.roles.toLowerCase().includes(ql)&&'roles')||'';
    else { for(const k of Object.keys(n.lists)){const p=n.lists[k].find(x=>x.toLowerCase().includes(ql)); if(p){why=p;break;}} }
    if(why!==null) res.push({id:n.id,why});
  });
  return res;
}

/* ---------- drawing ---------- */
const svg=$('#svg'), world=$('#world');
const view={k:.8,x:0,y:0};

function nm(n){return n.name[S.lang];}
function short(s,max){s=s.replace(/\s*\(.*$/,'');return s.length>max?s.slice(0,max-1)+'…':s;}
function lblXform(p,off){
  let deg=p.a*180/Math.PI; deg=((deg%360)+540)%360-180; const flip=Math.abs(deg)>90;
  return {tf:'translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+') rotate('+(flip?deg+180:deg).toFixed(1)+')', x:flip?-off:off, anchor:flip?'end':'start'};
}
function edgePath(a,b,idx){
  const pa=pos.get(vis(a)),pb=pos.get(vis(b));
  if(!pa||!pb) return null;
  const mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;
  // pull towards the centre; children of one parent stay short
  const near=(vis(a)===vis(b));
  if(near) return null;
  let k=.22;
  let cx=mx*k,cy=my*k;
  const dx=pb.x-pa.x,dy=pb.y-pa.y,len=Math.hypot(dx,dy)||1;
  cx+=-dy/len*idx*16; cy+=dx/len*idx*16;
  return {d:'M'+pa.x.toFixed(1)+','+pa.y.toFixed(1)+' Q'+cx.toFixed(1)+','+cy.toFixed(1)+' '+pb.x.toFixed(1)+','+pb.y.toFixed(1), mid:{x:.25*pa.x+.5*cx+.25*pb.x,y:.25*pa.y+.5*cy+.25*pb.y}};
}
function render(){

    const base=p.a+Math.PI, step=.66; const orbit=r+17;

/* ---------- navigation ---------- */
let anim=null;
function focusOn(id,zoom){
  const p=id==='ROOT'?{x:0,y:0}:pos.get(vis(id)); if(!p) return;
  const r=svg.getBoundingClientRect(); const k=Math.max(view.k,zoom||1.1);
  const tx=r.width/2-p.x*k, ty=r.height/2-p.y*k; animateTo(k,tx,ty);
}
function animateTo(k,x,y){
  const s={k:view.k,x:view.x,y:view.y}, t0=performance.now(); if(anim)cancelAnimationFrame(anim);
  const step=(now)=>{const u=Math.min(1,(now-t0)/320), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    view.k=s.k+(k-s.k)*e;view.x=s.x+(x-s.x)*e;view.y=s.y+(y-s.y)*e;applyView(); if(u<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
function fit(){
  const r=svg.getBoundingClientRect(); let minx=0,maxx=0,miny=0,maxy=0;
  nodes.forEach(n=>{if(!visible(n.id))return;const p=pos.get(n.id);const ext=(n.parent?R2:R1)>0?150:0;const ex=Math.cos(p.a)*ext,ey=Math.sin(p.a)*ext;
    [[p.x,p.y],[p.x+ex,p.y+ey]].forEach(q=>{minx=Math.min(minx,q[0]);maxx=Math.max(maxx,q[0]);miny=Math.min(miny,q[1]);maxy=Math.max(maxy,q[1]);});});
  const w=maxx-minx+60,h=maxy-miny+60; const k=Math.min(r.width/w,r.height/h);
  animateTo(k,r.width/2-((minx+maxx)/2)*k,r.height/2-((miny+maxy)/2)*k);
}

}

  if(t.dataset.chip){const n=byId.get(t.dataset.of);showTip('<b>'+esc(T_.layer[t.dataset.chip])+'</b>'+esc(nm(n))+': '+LI.get(n.id)[t.dataset.chip].length,ev);}
  else if(t.dataset.edge){const e=edgeById(t.dataset.edge); if(!e){hideTip();return;} const A=byId.get(e.from),B=byId.get(e.to);
    showTip('<b>'+esc(nm(A))+' ↔ '+esc(nm(B))+'</b>'+esc(T_.kind[e.kind])+' · '+(e.pair?e.files.length+' '+T_.files:esc(e.flow)),ev);}
  else if(t.dataset.node==='ROOT') showTip('<b>Selah</b>',ev);
  else {const n=byId.get(t.dataset.node);showTip('<b>'+esc(nm(n))+'</b>'+esc(n.summary[S.lang].length>170?n.summary[S.lang].slice(0,168)+'…':n.summary[S.lang]),ev);}
});
svg.addEventListener('mouseleave',hideTip);
// pan / zoom / click
const ptrs=new Map(); let drag=null, pinch=null;
svg.addEventListener('pointerdown',ev=>{ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===1) drag={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false,target:ev.target};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};drag=null;}
});
svg.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)) return; ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=svg.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch.k*d/pinch.d);return;}
  if(drag){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y; if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;svg.classList.add('drag');hideTip();}
    if(drag.moved){view.x=drag.vx+dx;view.y=drag.vy+dy;applyView();}}
});
function endPtr(ev){ptrs.delete(ev.pointerId); if(ptrs.size<2)pinch=null;
  if(drag&&!drag.moved&&ptrs.size===0&&ev.type==='pointerup') clickTarget(drag.target,ev);
  if(ptrs.size===0){drag=null;svg.classList.remove('drag');}}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
function zoomAt(px,py,k){k=Math.max(.15,Math.min(5,k));const f=k/view.k;view.x=px-(px-view.x)*f;view.y=py-(py-view.y)*f;view.k=k;applyView();}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();zoomAt(ev.clientX-r.left,ev.clientY-r.top,view.k*Math.exp(-ev.deltaY*.0015));},{passive:false});
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.k*1.3);};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,view.k/1.3);};
function clickTarget(target,ev){
  const t=target.closest&&target.closest('[data-chip],[data-edge],[data-node]');
  if(!t){ if(S.sel) select(null); return; }
  if(t.dataset.chip){ S.sel={t:'n',id:t.dataset.of}; all(); return; }
  if(t.dataset.edge){ select({t:'e',id:t.dataset.edge},{noFocus:true}); return; }
  if(t.dataset.node==='ROOT'){ select(null); fit(); return; }
  if(ev.detail>=2&&kids[t.dataset.node]){ toggleFold(t.dataset.node); return; }
  select({t:'n',id:t.dataset.node});
}
svg.addEventListener('dblclick',ev=>{const t=ev.target.closest('[data-node]');if(t&&kids[t.dataset.node])toggleFold(t.dataset.node);});
function toggleFold(id){ if(S.collapsed.has(id))S.collapsed.delete(id);else S.collapsed.add(id); all(); }

// panel + sidebar delegation
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-copy]'); if(c){ try{navigator.clipboard.writeText(c.dataset.copy);}catch(e){} const old=c.title; c.title=T[S.lang].copied; setTimeout(()=>{c.title=old;},900); return; }
  const g=ev.target.closest('[data-go]'); if(g){ ev.preventDefault(); S.view=null; select({t:'n',id:g.dataset.go}); return; }
  const eo=ev.target.closest('[data-edge-open]'); if(eo){ select({t:'e',id:eo.dataset.edgeOpen},{noFocus:true}); return; }
  if(ev.target.closest('#bConn')){ S.view=S.view==='conn'?null:'conn'; all(); return; }
  if(ev.target.closest('#bConf')){ S.view=S.view==='conf'?null:'conf'; all(); return; }
  if(ev.target.closest('#bFold')){ toggleFold(S.sel.id); return; }
  if(!ev.target.closest('.search')) $('#results').style.display='none';
});
document.addEventListener('change',ev=>{
  const l=ev.target.dataset&&ev.target.dataset.layer; if(l){ ev.target.checked?S.layers.add(l):S.layers.delete(l); all(); return; }
  const k=ev.target.dataset&&ev.target.dataset.kind; if(k){ ev.target.checked?S.kinds.add(k):S.kinds.delete(k); all(); return; }
  if(ev.target.id==='selMin'){ S.min=parseInt(ev.target.value); all(); }
});
$('#bFit').onclick=fit;
$('#bCollapse').onclick=()=>{Object.keys(kids).forEach(k=>S.collapsed.add(k));all();};
$('#bExpand').onclick=()=>{S.collapsed.clear();all();};
$('#bClear').onclick=()=>{S.sel=null;S.view=null;S.q='';all();};
$('#bLang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';all();};
$('#bTheme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=cur==='dark'?'light':'dark';};
const qi=$('#q'), res=$('#results');
qi.addEventListener('input',()=>{
  S.q=qi.value; const q=S.q.trim();
  if(!q){res.style.display='none';all();return;}
  const m=matches(q).slice(0,14);
  res.innerHTML=m.map(x=>{const n=byId.get(x.id);return '<button data-pick="'+esc(x.id)+'">'+esc(nm(n))+' <span class="ltr note">'+esc(n.id)+'</span>'+(x.why?'<small>'+esc(x.why)+'</small>':'')+'</button>';}).join('')||'<div class="note" style="padding:8px">'+T[S.lang].none+'</div>';
  res.style.display='block'; all(); qi.focus();
});
res.addEventListener('click',ev=>{const b=ev.target.closest('[data-pick]');if(!b)return;res.style.display='none';select({t:'n',id:b.dataset.pick});});
qi.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const m=matches(qi.value.trim());if(m.length){res.style.display='none';select({t:'n',id:m[0].id});}} if(ev.key==='Escape'){res.style.display='none';}});
document.addEventListener('keydown',ev=>{ if(ev.key==='/'&&document.activeElement!==qi&&!/input|select/i.test(document.activeElement.tagName)){ev.preventDefault();qi.focus();} if(ev.key==='Escape'&&document.activeElement!==qi){S.sel=null;S.view=null;all();} });
window.addEventListener('hashchange',()=>{readHash();all();if(S.sel&&S.sel.t==='n')focusOn(S.sel.id,1.15);});
window.addEventListener('resize',()=>{});

/* ---------- start ---------- */
readHash();
if(!location.hash){ try{ if(!/^ar/i.test(navigator.language||'ar')&&false) S.lang='en'; }catch(e){} }
all();
(function init(){
  const r=svg.getBoundingClientRect(); view.k=.5; view.x=r.width/2; view.y=r.height/2; applyView();
  fit();
  if(S.sel&&S.sel.t==='n'&&S.sel.id!=='ROOT') setTimeout(()=>focusOn(S.sel.id,1.15),380);
})();
// small hook for tests
window.__selahMap={S:S,select:select,all:all,nodes:nodes,links:links};
})();
</script>
</body>
</html>
