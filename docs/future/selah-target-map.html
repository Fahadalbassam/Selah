<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#566170; --line:#d5dbe3; --soft:#eceff4; --accent:#2457d6;

  --link:#8a96a8; --hot:#d6455a; --shadow:0 6px 24px rgba(20,30,50,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151c; --panel:#171e28; --ink:#e6ebf2; --muted:#a3aebd; --line:#2d3848; --soft:#1e2733; --accent:#7aa2ff;
    --built:#6fd19c; --built-bg:#173326; --refine:#f0b860; --refine-bg:#3a2c12; --planned:#9db6f2; --planned-bg:#1c2742;
    --link:#5f6c80; --hot:#ff8597; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10151c; --panel:#171e28; --ink:#e6ebf2; --muted:#a3aebd; --line:#2d3848; --soft:#1e2733; --accent:#7aa2ff;
  --built:#6fd19c; --built-bg:#173326; --refine:#f0b860; --refine-bg:#3a2c12; --planned:#9db6f2; --planned-bg:#1c2742;
  --link:#5f6c80; --hot:#ff8597; --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;display:flex;flex-direction:column;min-height:100%}
button,select,input{font:inherit;color:inherit}
button,select,input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .sub{color:var(--muted);font-size:13px;flex:1 1 200px;min-width:0}
.controls{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.controls label{display:flex;align-items:center;gap:6px;font-size:14px}
.controls fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.controls legend{float:left;padding:0;margin-inline-end:8px;font-size:13px;color:var(--muted);line-height:32px}
#stf{display:flex;flex-wrap:wrap;gap:6px 8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer;user-select:none;min-height:32px}
.chk input{margin:0}
.glyph{display:inline-block;width:14px;height:14px;flex:none}
.glyph .nd{cursor:inherit}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px 1px 6px;font-size:12.5px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.tag.built{color:var(--built);background:var(--built-bg)}
.tag.refine{color:var(--refine);background:var(--refine-bg)}
.tag.planned{color:var(--planned);background:var(--planned-bg);border-style:dashed}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
#stage{position:relative;min-height:420px;overflow:hidden;touch-action:none;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.drag{cursor:grabbing}
#zoom{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
#zoom button{width:40px;height:40px;padding:0;font-size:18px}
#hint{position:absolute;left:10px;top:8px;right:10px;color:var(--muted);font-size:12.5px;pointer-events:none}
#panel{background:var(--panel);border-inline-start:1px solid var(--line);overflow:auto;padding:14px 16px}
#panel h2{font-size:17px;margin:0 0 6px}
#panel h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#panel p{margin:6px 0}
.small{color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:start;vertical-align:top}
th{font-weight:600;color:var(--muted)}
.lv{font-weight:600;white-space:nowrap}
.lv.none{color:var(--muted);font-weight:400}
ul.conn{list-style:none;margin:0;padding:0}
ul.conn li{margin:0 0 6px}
ul.conn button{display:block;width:100%;text-align:start;min-height:0;padding:6px 8px}
ul.conn small{display:block;color:var(--muted)}
#list{display:none;padding:12px 16px 40px;overflow:auto}
#list h2{font-size:15px;margin:18px 0 6px}
#list ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
#list button{display:flex;gap:8px;align-items:center;width:100%;text-align:start;min-height:44px}
#list button .nm{flex:1;min-width:0}
#list button .rl{color:var(--muted);font-size:12.5px;white-space:nowrap}
body.listmode main{display:flex;flex-direction:column;overflow:auto}
body.listmode #list{order:1;overflow:visible;flex:none}
body.listmode #panel{order:2;overflow:visible;flex:none}
body.listmode #stage{display:none}
body.listmode #list{display:block}
body.listmode #panel{border:0;border-top:1px solid var(--line)}
/* map marks */
.lk{stroke:var(--link);stroke-width:1.2;opacity:.35}
.lk.on{stroke:var(--hot);stroke-width:2.6;opacity:1}
.lk.off{display:none}
.nd{cursor:pointer}
.nd .shape{stroke-width:2.5}
.nd.built .shape{fill:var(--built-bg);stroke:var(--built)}
.nd.refine .shape{fill:var(--refine-bg);stroke:var(--refine)}
.nd.planned .shape{fill:var(--planned-bg);stroke:var(--planned);stroke-dasharray:5 4}
.nd text{fill:var(--ink);font-size:13px;text-anchor:middle;pointer-events:none}
.nd text.st{font-size:11px;font-weight:700;letter-spacing:.04em}
.nd.built text.st{fill:var(--built)} .nd.refine text.st{fill:var(--refine)} .nd.planned text.st{fill:var(--planned)}
.nd text.idt{font-size:10.5px;font-weight:700}
.nd.dim{opacity:.13}
.nd.off{display:none}
.nd.sel .shape{stroke:var(--hot);stroke-width:4}
.nd:focus-visible{outline:none}
.nd:focus-visible .shape{stroke:var(--accent);stroke-width:4}
.ar text{fill:var(--muted);font-size:19px;font-weight:700;text-anchor:middle;cursor:pointer}
.ar circle{fill:var(--soft);opacity:.55}
@media (max-width: 860px){
  main{display:block;overflow:auto}
  #stage{height:62vh;min-height:340px}
  #panel{border:0;border-top:1px solid var(--line)}
  header .sub{flex-basis:100%}
  .controls{padding:8px 12px}
  header{padding:10px 12px}
  #list ul{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: no-preference){ #view{transition:none} }
</style>

const D = {"roles":[{"id":"fa","name":"Firm admin","side":"Firm"},{"id":"ld","name":"Lead","side":"Firm"},{"id":"dp","name":"Deputy","side":"Firm"},{"id":"co","name":"Consultant","side":"Firm"},{"id":"ob","name":"Observer","side":"Firm"},{"id":"ca","name":"Client admin","side":"Client"},{"id":"sp","name":"Sponsor / manager","side":"Client"},{"id":"cd","name":"Coordinator","side":"Client"},{"id":"ao","name":"Action owner","side":"Client"},{"id":"fr","name":"Firm-run client (no accounts)","side":"Client"}],"levels":{"F":"full","O":"own only","V":"view","N":"none","A":"applies","R":"through the firm"},"areas":[{"id":"A","name":"Access and privacy"},{"id":"S","name":"Winning and setting up a client"},{"id":"P","name":"The plan"},{"id":"W","name":"The action cycle"},{"id":"U","name":"Follow-up and meetings"},{"id":"R","name":"Reports and numbers"},{"id":"I","name":"The assistant"},{"id":"C","name":"Closing and leaving"},{"id":"H","name":"Help, notices and platform"}],"features":[{"id":"A1","area":"A","name":"Sign-in and accounts","status":"built","what":"Invitation only; nobody signs up. Firm staff and client admins use a password plus an authenticator code. Managers and action owners may use a one-time link by email. At most 10 sign-in tries per account in 15 minutes.","why":"","src":"HB 18; PP 1","roles":{"fa":"O","ld":"O","dp":"O","co":"O","ob":"O","ca":"O","sp":"O","cd":"O","ao":"O","fr":"N"},"notes":{}},{"id":"A2","area":"A","name":"People, invitations and access reviews","status":"refine","what":"Admins invite people, switch them off, and confirm every 90 days who is still with them. Switching a person off lists the work they still hold.","why":"When a client person leaves, the lead and the project's consultants are not told that owners changed, and the leaving dialog mentions a temporary head with no control (scenario 9).","src":"HB 18; WF 5, Part B","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"N","ca":"F","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"the firm list they may see","dp":"the firm list they may see","co":"the firm list they may see","ca":"own company"}},{"id":"A3","area":"A","name":"Permission core (\"Not found\")","status":"refine","what":"Every request is checked twice: authorize() with the policy table in the app, and row-level security in the database. A refused request looks like a missing one.","why":"The isolation sweep (scenario 19) is not finished, there is no outside penetration test, and the \"Not found\" page answers HTTP 200.","src":"FS 2, 5, 6; PP 1","roles":{"fa":"A","ld":"A","dp":"A","co":"A","ob":"A","ca":"A","sp":"A","cd":"A","ao":"A","fr":"A"},"notes":{}},{"id":"A4","area":"A","name":"Who sees an item (audience picker)","status":"built","what":"\"Everyone except...\" or \"Only these people...\" on a file (never evidence) or a meeting. It only takes people away. A person left out sees no row, count, notice, mail or assistant passage.","why":"","src":"FS 1.3; HB 09","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"F","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"co":"firm items they manage","ca":"the client's own items; client people only"}},{"id":"A5","area":"A","name":"Departments","status":"built","what":"Optional, off by default. When on, a manager or action owner sees only their department's actions and files. Open work can move between departments.","why":"","src":"HB 05; SM F05","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"V","ca":"F","sp":"O","cd":"O","ao":"N","fr":"N"},"notes":{"sp":"own departments","cd":"own departments","ao":"limited by it; no screen"}},{"id":"A6","area":"A","name":"Client groups (holdings)","status":"built","what":"Adds up the numbers of several companies of one group without merging their data. Shown once a group exists.","why":"","src":"HB 05; PP 3","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"co":"member clients they are on","ca":"if the firm grants it","sp":"if the firm grants it","cd":"if the firm grants it"}},{"id":"A7","area":"A","name":"Audit log","status":"refine","what":"Who did what and when, as ids and counts, never file text or assistant questions. Rows are chained, sealed and checked nightly. CSV export.","why":"Old rows still hold some private file names until the pre-go-live clean-up script is run once on the live database (written and tested, not run).","src":"PP 1, 5A; FS 5","roles":{"fa":"F","ld":"N","dp":"N","co":"N","ob":"N","ca":"O","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ca":"own company's trail"}},{"id":"A8","area":"A","name":"Legal pages and consent notices","status":"refine","what":"Terms, privacy notice and AI notice accepted and recorded at first sign-in; a data processing agreement template; the sub-processor list; a security pack showing this site's real setup.","why":"Not reviewed by a lawyer. Hosting location, retention and duties are not confirmed.","src":"HB 18; PP 1; FS 5","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"V","cd":"V","ao":"V","fr":"N"},"notes":{}},{"id":"A9","area":"A","name":"Erasing a person","status":"built","what":"On request the firm admin erases a person: the name becomes \"Former user #n\", sign-in data is deleted, history stays. It cannot be undone and is logged.","why":"","src":"HB 18","roles":{"fa":"F","ld":"N","dp":"N","co":"N","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"S1","area":"S","name":"Public inquiry form","status":"built","what":"A prospect fills the public form, or staff enter a referral or tender. The prospect gets a reference number by mail. Every firm admin is told.","why":"","src":"HB 07, 18","roles":{"fa":"F","ld":"O","dp":"O","co":"O","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"fa":"told of every new inquiry","ld":"enters referrals","dp":"enters referrals","co":"enters referrals"}},{"id":"S2","area":"S","name":"Inquiries inbox and conflict check","status":"refine","what":"Four numbered steps: give it an owner, discovery session, proposal, make it a client. The conflict check must be clear or overridden. NDA recorded. Win, or decline with an email.","why":"The conflict dialog defaults to \"conflict\", and two different words are still used for \"inquiry\" (scenario 1; after-scenarios list).","src":"WF 2, Part B; FS 5","roles":{"fa":"F","ld":"O","dp":"O","co":"O","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"fa":"wins or declines","ld":"inquiries they own","dp":"inquiries they own","co":"inquiries they own"}},{"id":"S3","area":"S","name":"Pitches","status":"built","what":"A draft client the firm is trying to win. Only the firm sees it. The firm admin makes it a client.","why":"","src":"HB 02; FIRM 3","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"fa":"also makes it a client"}},{"id":"S4","area":"S","name":"Client record and setup","status":"built","what":"The client page: Overview, People, Setup, Structure. Legal profile, contacts without accounts, second sign-off rule, \"Watch\" for firm admins. A \"minimal records\" client keeps no legal profile and has its free text cleared 90 days after handover.","why":"","src":"HB 06, 18; SM F04; docs/firm-settings.md","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"own clients","dp":"own clients","co":"clients they are on","ca":"own company"}},{"id":"S5","area":"S","name":"Participation modes (full, restricted, firm-run)","status":"built","what":"Full: any client role signs in. Restricted: up to two client admins. Firm-run: no client accounts; the consultant records progress and a second person reviews.","why":"","src":"HB 05; FS 1.4 (#197)","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"N","cd":"N","ao":"N","fr":"A"},"notes":{"fr":"this is their mode"}},{"id":"S6","area":"S","name":"Expertise profiles and lead suggestions","status":"refine","what":"Selah suggests up to five consultants for a new client from services, sector, language, availability and load. It only suggests. No performance scores.","why":"A consultant cannot set their own expertise although the page says they can; only the admin has the control (scenario 1). \"Make lead\" is hidden in a row menu.","src":"HB 04; WF Part B","roles":{"fa":"F","ld":"O","dp":"O","co":"O","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"own profile (target; today only the admin can)","dp":"own profile (target; today only the admin can)","co":"own profile (target; today only the admin can)"}},{"id":"S7","area":"S","name":"Staffing, join requests and client roles","status":"built","what":"The lead, deputy or admin puts consultants on the client's team and on each project. A consultant can ask to join with a reason. Client roles on a project: sponsor, coordinator, steering, acceptor, observer.","why":"","src":"HB 04; FIRM 4; apps/web/src/db/schema/app.ts (client_role)","roles":{"fa":"F","ld":"F","dp":"F","co":"O","ob":"N","ca":"O","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"co":"asks to join","ca":"adds own people to projects"}},{"id":"S8","area":"S","name":"Lead and deputy change with handover note","status":"refine","what":"The firm admin changes the lead in one step. The client's admins and the old lead are told, and a handover note travels with the change.","why":"Scenarios 6 and 7 still found the client is not told on screen when her consultant changes (only Help shows it), and reviews waiting on the old lead are not moved automatically.","src":"FS 1.4 (#199), 5; PP 4","roles":{"fa":"F","ld":"V","dp":"V","co":"N","ob":"N","ca":"V","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"told; the new lead gets the note","dp":"stays in place","ca":"told"}},{"id":"S9","area":"S","name":"Engagement record and end reminder","status":"refine","what":"The signed contract record with dates and deliverables. The lead, deputy and firm admins get a bell notice when an open engagement ends within 30 days, and again when it has ended and is still open. The client is never told.","why":"The notice does not say what to do next (renew, close, archive). The daily job must be scheduled on the server, and the first run after migration 0109 must be sized.","src":"HB 07; PP 4, 5A","roles":{"fa":"F","ld":"V","dp":"V","co":"V","ob":"V","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"reminded","dp":"reminded","co":"opens it to hand over"}},{"id":"S10","area":"S","name":"Deliverable hand-over and receipt","status":"built","what":"The firm hands over a deliverable's files. The client confirms receipt or comments. Four states: Not handed over, Handed over (waiting), Received, Commented. \"Received\" never means accepted.","why":"","src":"FS 1.3 (#171); WF 10","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"V","ao":"N","fr":"R"},"notes":{"co":"if staffed","ca":"confirms when no acceptor is named","sp":"confirms as acceptor, or when there is no acceptor and no admin","fr":"the consultant records receipt (LOG, 4a)"}},{"id":"P1","area":"P","name":"Projects","status":"built","what":"One project per phase or agreed scope. Five tabs: Plan, Requests and files, Meetings, Progress, People. A project no signed engagement covers stays a draft the client does not see.","why":"","src":"HB 06; FS 1.2 (#182)","roles":{"fa":"F","ld":"F","dp":"F","co":"O","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"co":"staffed projects only","sp":"projects they are added to","cd":"projects they are added to","ao":"sees own actions, not the project"}},{"id":"P2","area":"P","name":"Internal projects","status":"built","what":"The firm's own work with the same tools. Any firm member creates one and becomes its lead. Another firm member reviews. No client ever sees it.","why":"","src":"HB 14","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"fa":"sees all","ld":"if creator or staffed","dp":"if creator or staffed","co":"if creator or staffed","ob":"if staffed as observer"}},{"id":"P3","area":"P","name":"Findings and recommendations","status":"built","what":"Consultants write findings and recommendations. A recommendation can be withdrawn with a reason. Released items are never deleted. Clients read the plan; they never write it.","why":"","src":"HB 03; FIRM 5","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"O","fr":"N"},"notes":{"ao":"only the recommendation behind own actions; no titles or counts of others"}},{"id":"P4","area":"P","name":"Plan import and export","status":"refine","what":"Import the plan from Excel or Word; download it as Excel with a template and guide sheet. Import files are scanned first.","why":"If the client's people are not yet on the project, the import flags every owner as \"unknown\" and nothing on screen says why (scenario 1).","src":"WF 2, Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"P5","area":"P","name":"The client's answer to a recommendation","status":"built","what":"The client admin or the sponsor answers agree, partly agree or disagree, with a reason. Every answer stays on record. The firm may answer once.","why":"","src":"WF 3; CLIENT","roles":{"fa":"V","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"V","ao":"N","fr":"R"},"notes":{"ld":"may answer once","dp":"may answer once","co":"may answer once","sp":"the sponsor answers; other managers view","fr":"the consultant records it; a colleague confirms"}},{"id":"P6","area":"P","name":"Draft and release of actions","status":"refine","what":"An action starts as a draft nobody at the client can see. The consultant releases it with an owner and a due date. The owner and the client admin are told.","why":"The \"release now\" switch is on by default, is hard to see in dark mode and saved drafts by mistake (scenario 18). Draft actions are not marked on the plan list.","src":"FS 1.1 (D6), 2; WF Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"P7","area":"P","name":"Assessments and templates","status":"refine","what":"The firm builds and versions a template. A consultant answers each question. Low answers are suggested as gaps and a consultant confirms each as a finding. Scores are firm-only and never say \"compliant\".","why":"Only a starter template ships; the firm's own assessment cannot be loaded until the firm sends it. Guidance written for the consultant is shown to the client (after-scenarios list).","src":"HB 18; PP 3; GATEB B10, B18","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"ca":"only what the firm shares; never scores","sp":"only what the firm shares; never scores","cd":"only what the firm shares; never scores"}},{"id":"P8","area":"P","name":"Organisation structure (org chart)","status":"refine","what":"Positions, not people. The firm drafts (by hand, Excel, Word, or rows drafted from pasted text) and publishes versions. The client admin places people. PDF in A3 or A4. It never changes who sees any work.","why":"The publish-id bug is fixed (#215) but scenario 20 steps 10 to 12 were not re-run. The draft from pasted text gave 0 units after 135 s (scenario 20).","src":"FS 1.3, 2, 4.10; HB 13","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"V","cd":"V","ao":"O","fr":"N"},"notes":{"co":"edits the draft; cannot publish","ca":"places people, suggests changes","sp":"names in own branch and above","cd":"names in own branch and above","ao":"\"your manager\" only"}},{"id":"P9","area":"P","name":"Assessment help","status":"planned","what":"For each question, a suggested draft answer and score from the client's evidence against the reference library, each with a citation. Marked draft until a consultant takes it on. Never \"compliant\".","why":"Planned last. It depends on the reference library and the labelled test set, and runs as an overnight job on the shared model.","src":"LATER 2, 6","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"co":"accepts, changes or rejects each draft"}},{"id":"W1","area":"W","name":"Actions (the working cycle)","status":"refine","what":"Eight stored states: draft, assigned, in progress, blocked, awaiting review, revision requested, verified complete, closed. Late is a rule, not a state. Lists show one of six status words.","why":"On Home, \"Start work\" only opens the action; a second click starts it (scenario 2). \"Verified\" is used three ways in English.","src":"apps/web/src/lib/status-words.ts; WF 4, Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"F","cd":"F","ao":"O","fr":"R"},"notes":{"ob":"reads; may add a firm note","ca":"works actions only at a restricted client","sp":"company-wide work and own departments","cd":"company-wide work and own departments","ao":"own actions; no counts of others","fr":"the consultant records progress, marked \"recorded by a consultant\""}},{"id":"W2","area":"W","name":"Evidence and evidence items","status":"refine","what":"An action can name the pieces of proof it needs. The owner sends files (new, or already in Selah). Evidence is never deleted or renamed.","why":"Accepting an evidence item and verifying are two steps, and the first try gets an instruction instead of one combined step (scenarios 3 and 4).","src":"HB 18; WF 4, Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"F","cd":"F","ao":"O","fr":"R"},"notes":{"ca":"sends only at a restricted client","ao":"own actions","fr":"the consultant sends the file, saying how and when the client gave it"}},{"id":"W3","area":"W","name":"Review, verify and second sign-off","status":"built","what":"A consultant accepts (verified) or asks for a revision with a reason. Nobody reviews their own work. Where the rule asks, a second consultant signs off. The database refuses \"verified\" without a consultant's accept. The firm can reopen with a reason.","why":"","src":"HB 03; WF 4","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"V","sp":"V","cd":"V","ao":"V","fr":"R"},"notes":{"fa":"also when nobody else on a firm-run client can","co":"never own work","ca":"told the decision","sp":"told the decision","cd":"told the decision","ao":"told the decision","fr":"a second firm person must review"}},{"id":"W4","area":"W","name":"Date requests and slip history","status":"refine","what":"The owner asks for a new date with a reason. The firm approves or declines. The third move needs the lead or admin. Every move is kept.","why":"Decline acts at once: no reason box, no place to offer a meeting, and it cannot be taken back (scenario 5).","src":"WF 5, Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"F","cd":"F","ao":"O","fr":"N"},"notes":{"fa":"decides a third move","ld":"decides a third move","co":"decides the first two","ca":"sees the answers","sp":"asks","cd":"asks","ao":"asks on own actions"}},{"id":"W5","area":"W","name":"\"I am stuck\"","status":"built","what":"The owner marks the action blocked with a reason. It reads \"Needs attention\", joins the next agenda, and the lead, deputy and the project's consultants are told.","why":"","src":"FS 1.4 (#200); CLIENT","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"F","cd":"F","ao":"O","fr":"N"},"notes":{"ld":"told","dp":"told","co":"told when on the project","ao":"own actions"}},{"id":"W6","area":"W","name":"Risk acceptance and closing an action","status":"refine","what":"A client admin or manager signs a risk acceptance. The firm then closes the action with an outcome: partly done, risk accepted, not applicable, or replaced by another action.","why":"The Sign button is disabled with no message saying why (scenarios 3 and 4).","src":"HB 08; WF Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{"fa":"closes the action","ld":"closes the action","dp":"closes the action","co":"closes the action","ca":"signs","sp":"signs","cd":"signs","fr":"not stated in the sources"}},{"id":"W7","area":"W","name":"Give to a colleague (owner change)","status":"refine","what":"Moves an action to someone else on the same side. The status stays. Old and new owners, the lead, the deputy and the project's consultants are told. The server refuses an owner who may not be on the project.","why":"When a client admin moves a leaver's actions, only the new owner is told and the history shows no \"owner changed\" line (scenario 9).","src":"FS 1.1 (D1), 2; WF 5","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"F","sp":"F","cd":"F","ao":"O","fr":"N"},"notes":{"ao":"own actions, where allowed","fr":"the firm names the owner on the action"}},{"id":"W8","area":"W","name":"Discussion, mentions and firm notes","status":"built","what":"A discussion on each action for everyone who can open it, with mentions. Firm-only notes beside it.","why":"","src":"HB 06; CLIENT","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"O","ca":"F","sp":"F","cd":"F","ao":"O","fr":"N"},"notes":{"ob":"firm notes only","ao":"own actions"}},{"id":"W9","area":"W","name":"Document requests and upload links","status":"built","what":"The firm lists the documents it needs, each with an owner and a due date. The client answers with a file or \"does not apply\". A no-login link serves one item (1 hour to 30 days, up to ten files, revocable).","why":"","src":"HB 09; WF 6","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"F","ao":"O","fr":"R"},"notes":{"ao":"when asked by name","fr":"answers through a no-login upload link"}},{"id":"W10","area":"W","name":"Files (labels, versions, scan)","status":"built","what":"Shared, firm-only, client-private or personal. Up to 20 MB, type checked three ways, virus-scanned before anyone opens it. Versions kept. A wrong upload is withdrawn with a reason.","why":"","src":"HB 09","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"O","cd":"O","ao":"O","fr":"R"},"notes":{"fa":"never client-private files","sp":"company-wide and own department","cd":"company-wide and own department","ao":"own, shared with them, department teammates'","fr":"uploads by link only"}},{"id":"U1","area":"U","name":"Home (one per role)","status":"built","what":"What waits for each person, each row with its next step. Action owners see three groups: Waiting for you, With your consultant, Finished.","why":"","src":"HB 06; FS 1.2 (#179)","roles":{"fa":"O","ld":"O","dp":"O","co":"O","ob":"O","ca":"O","sp":"O","cd":"O","ao":"O","fr":"N"},"notes":{}},{"id":"U2","area":"U","name":"Reminders and the escalation ladder","status":"refine","what":"A reminder before the due date; the owner when overdue; managers and the lead after 7 days; client admins, the sponsor and watching firm admins after 14 days. One summary mail a day at most. Days are set on each project.","why":"Work mail held for the weekend gives no sign that it is held (scenarios 1 to 3). Nothing is defined after the last step.","src":"HB 08, 18; WF Part B","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"V","ca":"V","sp":"V","cd":"V","ao":"V","fr":"N"},"notes":{"fa":"only if staffed or watching","ld":"from the 7-day step","sp":"managers at 7 days; the sponsor at the last step","cd":"at the 7-day step","ca":"at the last step","ao":"own actions"}},{"id":"U3","area":"U","name":"Oversight lists and the Projects table","status":"built","what":"Lists across projects: late, blocked, no activity, date moved twice, sent back twice, no active owner. \"Remind the owner\" once a day. Counts only, never a health word.","why":"","src":"HB 06; FS 1.1 (D2, D5)","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"ob":"no \"Remind the owner\"","ca":"Late and Blocked only","sp":"Late and Blocked only","cd":"Late and Blocked only"}},{"id":"U4","area":"U","name":"Meetings (booking, invites, agenda)","status":"refine","what":"Book with a call link (Meet, Teams or Zoom). Calendar invitations by email. The agenda writes itself from late, awaiting-review, blocked and changed work. Department and whole-project meetings.","why":"\"Mark as held\" shows only after the start time (scenario 10). A department-limited manager's Meetings tab reads \"none for you yet\" although she is invited.","src":"HB 11; FS 2, 5","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"F","ao":"O","fr":"R"},"notes":{"ca":"books shared meetings","sp":"books shared meetings; no whole-project meeting if department-limited","cd":"books shared meetings","ao":"meetings they are invited to; own actions on the agenda","fr":"calendar invitation by email"}},{"id":"U5","area":"U","name":"Summaries, decisions and follow-ups","status":"refine","what":"The summary is written by hand, firm-only first, then shareable. Decisions are never edited: a correction is a new decision. Follow-ups have an assignee and a date. A transcript is firm-only and deleted 30 days after the summary is confirmed.","why":"The summary switch is labelled \"firm only\" but ON means shared (scenario 10).","src":"HB 11; WF Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"O","fr":"N"},"notes":{"ca":"shared summaries; own follow-ups","sp":"shared summaries; own follow-ups","cd":"shared summaries; own follow-ups","ao":"own follow-ups"}},{"id":"U6","area":"U","name":"Stuck or overloaded lanes","status":"planned","what":"From action history: a consultant with many reviews waiting long, a client person who owns most late work in a department, a project where nothing moved for weeks. Facts only, shown to the firm admin or the lead, who decide.","why":"Planned first: database queries only, no model. No score or ranking of a person.","src":"LATER 3, 6","roles":{"fa":"V","ld":"V","dp":"V","co":"N","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"dp":"as the lead (the deputy can do what the lead can)"}},{"id":"U7","area":"U","name":"Concern flags (facts, no score)","status":"planned","what":"Facts about a project that may need a look, for firm staff. No score.","why":"On the after-scenarios list. Not designed yet: which facts count and who sees them are open.","src":"FS 5; GATEB B11","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"U8","area":"U","name":"Decisions list and calendar screen","status":"planned","what":"One list of all decisions across meetings, and a calendar screen.","why":"Proposals only. Each must first be shown to be useful.","src":"HB 11; WF (not built box)","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"V","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ca":"not decided"}},{"id":"R1","area":"R","name":"Progress reports (templates, approval, confirmed send)","status":"refine","what":"A report freezes the project's numbers on the last day of the period. Three templates. A colleague other than the writer approves. A person confirms the send. Selah never sends on its own.","why":"Sending a report gives the client no notice, and the PDF header date uses UTC and can show the previous day (scenario 11).","src":"HB 12; FS 2, 5","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"fa":"approves","ld":"approves","dp":"approves","co":"writes; a colleague approves","ca":"reads once sent","sp":"reads once sent; shared work only","cd":"reads once sent; shared work only"}},{"id":"R2","area":"R","name":"Monthly status pack","status":"built","what":"Drafted by the monthly job, seen only by the firm. The consultant adds a note and issues it; it is then approved and sent like any report.","why":"","src":"HB 12; SM F15","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"V","sp":"V","cd":"V","ao":"N","fr":"N"},"notes":{"ld":"told when it is drafted","ca":"reads once sent","sp":"reads once sent","cd":"reads once sent"}},{"id":"R3","area":"R","name":"Business indicators","status":"refine","what":"The client's own figures with a baseline and a target, typed, imported or connected. Always labelled \"reported by the client, not verified impact\". Only the firm links an indicator to a recommendation. A \"moved away\" notice gives figures only.","why":"The import button is hidden until a data mode is chosen (scenario 12).","src":"HB 12; WF 9, Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"F","ao":"N","fr":"R"},"notes":{"co":"enters, links, checks","ca":"chooses how numbers arrive; enters values","sp":"enters values","cd":"enters values","fr":"the firm enters the figures"}},{"id":"R4","area":"R","name":"Exports and PDFs","status":"refine","what":"Plan as Excel, actions list, report PDFs, client report, closure report, structure PDF, audit CSV, export pack. Each holds only what the reader could already open and is logged.","why":"An export asked for in English from an Arabic screen has Arabic labels, and the closure PDF total was off by one (GATEB B13; scenario 14).","src":"HB 18; FS 2, 5","roles":{"fa":"O","ld":"O","dp":"O","co":"O","ob":"O","ca":"O","sp":"O","cd":"O","ao":"O","fr":"N"},"notes":{}},{"id":"R5","area":"R","name":"Indicator help","status":"planned","what":"Reads values from a spreadsheet the client uploads and proposes rows. Flags a value that moved away from its target. Suggests a likely link to a recommendation. Never says a recommendation caused a change.","why":"The flag and the spreadsheet rows need no model and come first. Messy files and suggested links use the shared model, after the value test.","src":"LATER 1, 6","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{"fa":"confirms links","ld":"confirms links","dp":"confirms links","co":"confirms links","ca":"accepts each value","sp":"accepts each value","cd":"accepts each value"}},{"id":"R6","area":"R","name":"Own report templates and a richer editor","status":"planned","what":"The firm makes its own templates and writes the note with headings, lists and small tables. Approval and a confirmed send still apply.","why":"Research first: Arabic right-to-left editing, safe storage, PDF and translation.","src":"LATER 4; HB 12","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"R7","area":"R","name":"The client's own report page","status":"planned","what":"The client keeps and edits the assistant's progress-update draft as the company's own report. The firm sees it only if the client shares it. Selah never sends it.","why":"No model needed. Listed among the first items to build.","src":"LATER 4, 6","roles":{"fa":"V","ld":"V","dp":"V","co":"V","ob":"N","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{"fa":"only if the client shares it","ld":"only if the client shares it","dp":"only if the client shares it","co":"only if the client shares it"}},{"id":"I1","area":"I","name":"Staff assistant","status":"refine","what":"Questions about one project or all the asker's clients. Every answer cites the file, version and page, or the record. Follow-up message drafts, never sent. It never approves, closes or changes anything.","why":"Median 117 s per answer on the test laptop's processor. Of 19 scored answers 10 were right, 3 partly right, 6 wrong. A scanned page produced an invented answer. An answer that only echoes the question shows as grounded (FS 4.2, 4.4, 5).","src":"HB 10; FS 4","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"F","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ld":"own clients","dp":"own clients","co":"staffed projects only","ob":"the project they observe (policy: OPEN_TO_OBSERVERS)"}},{"id":"I2","area":"I","name":"Client assistant","status":"refine","what":"Off by default. The firm admin offers it per client and role with a daily question limit; the client admin must agree and can switch it off. Facts only: who is my consultant, my deadlines, what the documents say. Never firm-only files, scores, notes or other clients.","why":"A legal question is refused without a pointer to what the documents say (FS 5), and answers are as slow as on the staff side.","src":"HB 10; FS 1.4 (#198), 5","roles":{"fa":"F","ld":"N","dp":"N","co":"N","ob":"N","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{"fa":"offers it; sets the daily limit","ca":"must agree; can switch it off","sp":"if offered and agreed","cd":"if offered and agreed"}},{"id":"I3","area":"I","name":"@-attach a file","status":"refine","what":"Type @ to attach up to three files the asker can already see. Chips warn if a file is scanned, not yet indexed or switched off.","why":"An attached file that could not be read was answered as if it were another file (scenario 13). The answer should say the attachment was skipped.","src":"HB 10; WF Part B","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"F","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{}},{"id":"I4","area":"I","name":"Progress draft and \"Use as draft\"","status":"refine","what":"A facts-only progress draft marked \"Draft: check before sending\". For firm staff, \"Use as draft\" opens the report page with the text as the note. For client people it stays in their own chat.","why":"In scenario 13 the draft said 0 verified and 1 late while the project page said 1 of 8 and 3 late.","src":"HB 12; FS 2","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"O","sp":"O","cd":"O","ao":"N","fr":"N"},"notes":{"ob":"can ask; does not edit reports (not checked in code)","ca":"stays in own chat","sp":"stays in own chat","cd":"stays in own chat"}},{"id":"I5","area":"I","name":"Search index, masking and the AI service","status":"refine","what":"Files switched on for the assistant are read into passages, embedded (bge-m3) and searched with the permission filter inside the query. Known names are masked before text reaches a model; masking fails closed. One local model (qwen3.5:4b) answers. Arabic spelling fold.","why":"A name that appears only inside a file is not masked, so real client files go only to a local model. Some organisation names over-mask. 8 of 89 scored questions missed the right passage (FS 4.3).","src":"HB 10; FS 4.3, 5","roles":{"fa":"A","ld":"A","dp":"A","co":"A","ob":"A","ca":"A","sp":"A","cd":"A","ao":"A","fr":"A"},"notes":{}},{"id":"I6","area":"I","name":"Personal-number scanner","status":"built","what":"A rule-based scanner replaces national IDs, Iqama numbers, IBANs, card numbers, phones, emails, passport and commercial-registration numbers with tags, at indexing and at sending. The stored file never changes.","why":"","src":"HB 10; FS 4.5 (scanner timing: not measured)","roles":{"fa":"A","ld":"A","dp":"A","co":"A","ob":"A","ca":"A","sp":"A","cd":"A","ao":"A","fr":"A"},"notes":{}},{"id":"I7","area":"I","name":"Background AI jobs","status":"built","what":"Translations, file summaries, indexing and the org chart draft run in one shared queue, one model run at a time. The card says \"Still working\"; 10-minute ceilings.","why":"","src":"FS 1.4 (#208, #211)","roles":{"fa":"A","ld":"A","dp":"A","co":"A","ob":"A","ca":"A","sp":"A","cd":"A","ao":"A","fr":"N"},"notes":{}},{"id":"I8","area":"I","name":"Translation and file summaries on demand","status":"built","what":"\"Show in English\" or \"اعرض بالعربية\" on written text, labelled \"Machine translated\" with \"Show original\". File summaries with page links. Made once, then kept.","why":"","src":"HB 10, 18","roles":{"fa":"O","ld":"O","dp":"O","co":"O","ob":"O","ca":"O","sp":"O","cd":"O","ao":"O","fr":"N"},"notes":{}},{"id":"I9","area":"I","name":"Scanned pages (text recognition)","status":"planned","what":"Text recognition only on pages marked scanned, in the shared queue, indexed once. Runs on the processor.","why":"After-scenarios list. A scanned board minute is invisible to the assistant today.","src":"LATER 4; FS 5","roles":{"fa":"A","ld":"A","dp":"A","co":"A","ob":"A","ca":"A","sp":"A","cd":"A","ao":"N","fr":"N"},"notes":{}},{"id":"I10","area":"I","name":"Save an answer as a note","status":"planned","what":"Save an assistant answer with its citations as a firm-only note on the project, by the person who asked. Never shared with the client automatically.","why":"After-scenarios list. No model needed.","src":"LATER 4","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"I11","area":"I","name":"\"What changed\" and the meeting brief","status":"planned","what":"A cited list of changes since the asker's last visit, and a brief built from a meeting's agenda, open decisions and open actions, marked as a draft.","why":"Waits for the value test: tasks 3 and 6 show whether the time saved is worth it.","src":"LATER 4; docs/value-test.md","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"F","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"I12","area":"I","name":"Meeting summary draft; assistant reads summaries","status":"planned","what":"An AI draft of the summary from a transcript, and the assistant reading confirmed summaries and decisions.","why":"Proposals only. Each must first be shown to be useful.","src":"HB 11","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"N","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{}},{"id":"I13","area":"I","name":"Reference library","status":"planned","what":"Six governance and strategy references the assistant and the assessment help can cite, kept apart from client evidence. Every citation is labelled \"Reference\" with the source, edition and place.","why":"Needs a licence check of each source first. Two sources are copyrighted books: the library holds the firm's short notes, not their text.","src":"LATER 5; PP 6","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"F","ca":"N","sp":"N","cd":"N","ao":"N","fr":"N"},"notes":{"ca":"not decided"}},{"id":"C1","area":"C","name":"Project closing","status":"refine","what":"The client can ask to close. The lead or deputy starts closing. Every open action gets a decision: handed over, deferred, withdrawn or waived. Lessons are firm-only. The firm admin closes; the project becomes read-only. Closure report PDF. Reopen with a reason.","why":"\"Start closing\" exists only in the ⋯ menu; the closure PDF total was off by one; a reopened project sends no notice to the client admin (scenario 14).","src":"WF 12, Part B; apps/web/src/db/schema/app.ts (closure_disposition)","roles":{"fa":"F","ld":"F","dp":"F","co":"F","ob":"V","ca":"F","sp":"F","cd":"V","ao":"N","fr":"N"},"notes":{"fa":"final close and reopen","ld":"starts closing","dp":"starts closing","co":"decisions on open actions and lessons (policy closure.dispose, closure.lessons)","ca":"asks to close; names who carries work on","sp":"asks to close; names who carries work on"}},{"id":"C2","area":"C","name":"Closing survey and case-study consent","status":"built","what":"After closing, the client people asked answer a short survey; only the firm admin and the client's lead read it. Case-study consent is optional and can be withdrawn. Kept out of the way: not put in front of every client.","why":"","src":"PP 3; apps/web/src/authz/policy.ts (pulse.*, case_study.*)","roles":{"fa":"V","ld":"V","dp":"N","co":"N","ob":"N","ca":"F","sp":"F","cd":"F","ao":"N","fr":"N"},"notes":{"fa":"reads the answers","ld":"reads the answers","ca":"answers if asked; consent","sp":"answers if asked; consent","cd":"answers if asked; consent"}},{"id":"C3","area":"C","name":"Archiving a client (offboarding)","status":"refine","what":"When every project is closed the firm admin archives the client: a read-only grace period, t const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, t) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; };
const h = (n, a = {}, t) => { const e = document.createElement(n); for (const k in a) e.setAttribute(k, a[k]); if (t != null) e.textContent = t; return e; };
const byId = new Map(D.features.map((f) => [f.id, f]));
const STATUS = ['built', 'refine', 'planned'];
const WHY = { refine: 'Why it must change', planned: 'Why it is not built yet' };
const state = { role: '', st: { built: true, refine: true, planned: true }, q: '', sel: null };

// ---- status glyph: a shape as well as a colour ----
function glyphSvg(st, size = 14) {
  const s = el('svg', { viewBox: '-10 -10 20 20', width: size, height: size, class: 'glyph', 'aria-hidden': 'true' });
  const g = el('g', { class: 'nd ' + st }); g.appendChild(shape(st, 7)); s.appendChild(g);
  return s;
}
function shape(st, r) {
  if (st === 'built') return el('circle', { r, class: 'shape' });
  if (st === 'refine') return el('path', { d: `M0 ${-r * 1.25} L${r * 1.25} 0 L0 ${r * 1.25} L${-r * 1.25} 0 Z`, class: 'shape' });
  return el('rect', { x: -r, y: -r, width: 2 * r, height: 2 * r, rx: 2, class: 'shape' });
}
function tag(st) { const t = h('span', { class: 'tag ' + st }); t.appendChild(glyphSvg(st, 12)); t.appendChild(document.createTextNode(st)); return t; }

// ---- layout: areas on a circle, features on one or two rings around each area ----
const AREA_R = 1150;
D.areas.forEach((a, i) => {
  const ang = -Math.PI / 2 + (i * 2 * Math.PI) / D.areas.length;
  a.x = AREA_R * Math.cos(ang); a.y = AREA_R * Math.sin(ang);
  const fs = D.features.filter((f) => f.area === a.id);
  const n = fs.length, inner = n <= 8 ? 0 : Math.floor(n / 3);
  a.r = n <= 8 ? 200 : 285;
  fs.forEach((f, j) => {
    let r, k, m, off;
    if (j < inner) { r = 125; k = j; m = inner; off = Math.PI / 2; }
    else { r = a.r; k = j - inner; m = n - inner; off = -Math.PI / 2 + (inner ? Math.PI / m : 0); }
    const t = off + (k * 2 * Math.PI) / m;
    f.x = a.x + r * Math.cos(t); f.y = a.y + r * Math.sin(t);
  });
});
const n8 = (a) => D.features.filter((f) => f.area === a.id).length <= 8; // one ring: the centre is free for the area name
const wrap = (s, w) => { const out = []; let cur = ''; for (const word of s.split(' ')) { if ((cur + ' ' + word).trim().length > w && cur) { out.push(cur); cur = word; } else cur = (cur + ' ' + word).trim(); } if (cur) out.push(cur); return out.slice(0, 3).map((l, i, arr) => (i === 2 && out.length > 3 ? l + '…' : l)); };

// ---- draw ----
const gA = $('#gAreas'), gL = $('#gLinks'), gN = $('#gNodes');
D.areas.forEach((a) => {
  const g = el('g', { class: 'ar', tabindex: 0, role: 'button', 'aria-label': 'Zoom to area: ' + a.name });
  g.appendChild(el('circle', { cx: a.x, cy: a.y, r: a.r + 105 }));
  const lines = wrap(a.name, n8(a) ? 16 : 40);
  const ty = n8(a) ? a.y : a.y - a.r - 58 - (lines.length - 1) * 22;
  lines.forEach((l, i) => g.appendChild(el('text', { x: a.x, y: ty + (n8(a) ? (i - (lines.length - 1) / 2) * 22 + 6 : i * 22) }, l)));
  const go = () => zoomTo(a.x, a.y, a.r + 150);
  g.addEventListener('click', (e) => { if (!moved) go(); });
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  gA.appendChild(g);
});
const linkEls = D.links.map(([a, b, t]) => {
  const A = byId.get(a), B = byId.get(b);
  const ln = el('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: 'lk' });
  gL.appendChild(ln); return { a, b, t, ln };
});
const nodeEls = new Map();
D.features.forEach((f) => {
  const g = el('g', { class: 'nd ' + f.status, transform: `translate(${f.x} ${f.y})`, tabindex: 0, role: 'button', 'aria-label': `${f.id} ${f.name}. Status: ${f.status}.` });
  g.appendChild(shape(f.status, 17));
  g.appendChild(el('text', { y: 4, class: 'idt' }, f.id));
  wrap(f.name, 19).forEach((l, i) => g.appendChild(el('text', { y: 36 + i * 15 }, l)));
  g.appendChild(el('text', { y: 36 + wrap(f.name, 19).length * 15 + 1, class: 'st' }, f.status.toUpperCase()));
  g.addEventListener('click', () => { if (!moved) select(f.id); });
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(f.id); } });
  gN.appendChild(g); nodeEls.set(f.id, g);
});

// ---- pan and zoom ----
const svg = $('#svg'), view = $('#view');
let V = { x: 0, y: 0, k: 1 }, moved = false;
const apply = () => view.setAttribute('transform', `translate(${V.x} ${V.y}) scale(${V.k})`);
function fit() { zoomTo(0, 0, AREA_R + 480, true); }
function zoomTo(cx, cy, half) {
  const r = svg.getBoundingClientRect(); if (!r.width || !r.height) return;
  V.k = Math.min(r.width, r.height) / (2 * half); V.x = r.width / 2 - cx * V.k; V.y = r.height / 2 - cy * V.k; apply();
}
function zoomAt(px, py, factor) {
  const k = Math.max(0.05, Math.min(4, V.k * factor));
  V.x = px - ((px - V.x) * k) / V.k; V.y = py - ((py - V.y) * k) / V.k; V.k = k; apply();
}
const pts = new Map(); let last = null;
svg.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; last = null; });
svg.addEventListener('pointermove', (e) => {
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId), nx = e.clientX, ny = e.clientY;
  if (pts.size === 1) {
    const dx = nx - p.x, dy = ny - p.y;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { moved = true; svg.classList.add('drag'); try { svg.setPointerCapture(e.pointerId); } catch (_) {} }
    V.x += dx; V.y += dy; apply(); pts.set(e.pointerId, { x: nx, y: ny });
  } else if (pts.size === 2) {
    pts.set(e.pointerId, { x: nx, y: ny });
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if (last) { zoomAt(mx, my, d / last.d); V.x += mx - last.mx; V.y += my - last.my; apply(); }
    last = { d, mx, my }; moved = true;
  }
});
const up = (e) => { pts.delete(e.pointerId); last = null; svg.classList.remove('drag'); setTimeout(() => { if (!pts.size) moved = false; }, 0); };
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
svg.addEventListener('wheel', (e) => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
const centre = () => { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
$('#zin').onclick = () => zoomAt(...centre(), 1.3);
$('#zout').onclick = () => zoomAt(...centre(), 1 / 1.3);
$('#zfit').onclick = fit;

// ---- filters ----
const uses = (f, role) => !role || f.roles[role] !== 'N';
const matches = (f) => !state.q || (f.id + ' ' + f.name).toLowerCase().includes(state.q);
const shown = (f) => state.st[f.status];
function refresh() {
  let n = 0;
  D.features.forEach((f) => {
    const g = nodeEls.get(f.id), on = shown(f), lit = on && uses(f, state.role) && matches(f);
    g.classList.toggle('off', !on); g.classList.toggle('dim', on && !lit); g.classList.toggle('sel', state.sel === f.id);
    g.setAttribute('aria-hidden', on ? 'false' : 'true'); g.setAttribute('tabindex', on ? 0 : -1);
    if (lit) n++;
  });
  linkEls.forEach((l) => {
    const off = !shown(byId.get(l.a)) || !shown(byId.get(l.b));
    l.ln.classList.toggle('off', off); l.ln.classList.toggle('on', !off && state.sel && (l.a === state.sel || l.b === state.sel));
  });
  const rn = state.role ? D.roles.find((r) => r.id === state.role).name : '';
  $('#count').textContent = `${n} of ${D.features.length} features` + (rn ? ` used by: ${rn}` : '');
  drawList(); drawPanel();
}

// ---- controls ----
const roleSel = $('#role');
['Firm', 'Client'].forEach((side) => { const og = h('optgroup', { label: side + ' side' }); D.roles.filter((r) => r.side === side).forEach((r) => og.appendChild(h('option', { value: r.id }, r.name))); roleSel.appendChild(og); });
roleSel.onchange = () => { state.role = roleSel.value; refresh(); };
STATUS.forEach((st) => {
  const lab = h('label', { class: 'chk' }), cb = h('input', { type: 'checkbox' }); cb.checked = true;
  cb.onchange = () => { state.st[st] = cb.checked; if (state.sel && !shown(byId.get(state.sel))) state.sel = null; refresh(); };
  const n = D.features.filter((f) => f.status === st).length;
  lab.appendChild(cb); lab.appendChild(glyphSvg(st)); lab.appendChild(document.createTextNode(`${st} (${n})`)); $('#stf').appendChild(lab);
});
$('#q').oninput = (e) => { state.q = e.target.value.trim().toLowerCase(); refresh(); };
const themes = ['auto', 'light', 'dark']; let ti = 0;
$('#bTheme').onclick = () => { ti = (ti + 1) % 3; const t = themes[ti]; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); $('#bTheme').textContent = 'Theme: ' + t; };
$('#bList').onclick = () => { const on = !document.body.classList.contains('listmode'); document.body.classList.toggle('listmode', on); $('#bList').setAttribute('aria-pressed', on); if (!on) fit(); };

// ---- list view ----
function drawList() {
  const box = $('#list'); box.textContent = '';
  D.areas.forEach((a) => {
    const fs = D.features.filter((f) => f.area === a.id && shown(f) && uses(f, state.role) && matches(f));
    if (!fs.length) return;
    box.appendChild(h('h2', {}, `${a.name} (${fs.length})`));
    const ul = h('ul');
    fs.forEach((f) => {
      const li = h('li'), b = h('button', { 'aria-label': `${f.id} ${f.name}. Status: ${f.status}.` });
      b.appendChild(glyphSvg(f.status)); b.appendChild(h('span', { class: 'nm' }, `${f.id} ${f.name}`)); b.appendChild(tag(f.status));
      if (state.role) b.appendChild(h('span', { class: 'rl' }, D.levels[f.roles[state.role]]));
      b.onclick = () => { select(f.id); $('#panel').scrollIntoView({ block: 'start' }); };
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
  });
  if (!box.children.length) box.appendChild(h('p', { class: 'small' }, 'No feature matches these filters.'));
}

// ---- detail panel ----
function select(id) { state.sel = state.sel === id ? null : id; refresh(); }
function drawPanel() {
  const p = $('#panel'); p.textContent = '';
  const f = state.sel && byId.get(state.sel);
  if (!f) {
    p.appendChild(h('h2', {}, 'How to read this map'));
    p.appendChild(h('p', {}, 'Each mark is one feature of the target product. Lines show how features connect. Pick a feature to see what it does, who uses it, and what it connects to.'));
    p.appendChild(h('h3', {}, 'Status'));
    const tb = h('table');
    [['built', 'On main today. The target keeps it as it is.', 'circle'], ['refine', 'Built, but it must change. The reason is shown.', 'diamond'], ['planned', 'Not built. Written down as a later improvement or a proposal.', 'dashed square']].forEach(([st, txt, sh]) => {
      const tr = h('tr'), td = h('td'); td.appendChild(tag(st)); tr.appendChild(td);
      tr.appendChild(h('td', {}, `${txt} Shape: ${sh}. Count: ${D.features.filter((x) => x.status === st).length}.`)); tb.appendChild(tr);
    });
    p.appendChild(tb);
    p.appendChild(h('h3', {}, 'Access words'));
    p.appendChild(h('p', { class: 'small' }, 'full: does the work of the feature. own only: only their own items. view: reads. none: no access. applies: not a screen; the rule or service covers this role. through the firm: no account; the firm records it, or it arrives by email or link.'));
    if (state.role) {
      const r = D.roles.find((x) => x.id === state.role);
      p.appendChild(h('h3', {}, r.name));
      const c = {}; D.features.forEach((x) => { const l = D.levels[x.roles[r.id]]; c[l] = (c[l] || 0) + 1; });
      p.appendChild(h('p', {}, Object.entries(c).map(([k, v]) => `${k}: ${v}`).join(' · ')));
      p.appendChild(h('p', { class: 'small' }, 'Features this role does not use are faded on the map and left out of the list.'));
    }
    p.appendChild(h('h3', {}, 'Numbers'));
    p.appendChild(h('p', { class: 'small' }, `${D.features.length} features in ${D.areas.length} areas, ${D.links.length} connections, ${D.roles.length} roles. Sources are named on each feature; the short names are explained in selah-target.md, section 1.`));
    return;
  }
  const a = D.areas.find((x) => x.id === f.area);
  p.appendChild(h('div', { class: 'small' }, `${f.id} · ${a.name}`));
  p.appendChild(h('h2', {}, f.name));
  p.appendChild(tag(f.status));
  p.appendChild(h('p', {}, f.what));
  if (f.why) { p.appendChild(h('h3', {}, WHY[f.status])); p.appendChild(h('p', {}, f.why)); }
  p.appendChild(h('p', { class: 'small' }, 'Source: ' + f.src));
  p.appendChild(h('h3', {}, 'Who uses it'));
  const tb = h('table');
  D.roles.forEach((r) => {
    const tr = h('tr'); if (r.id === state.role) tr.style.background = 'var(--soft)';
    tr.appendChild(h('th', { scope: 'row' }, r.name));
    const lv = D.levels[f.roles[r.id]], td = h('td');
    td.appendChild(h('span', { class: 'lv' + (lv === 'none' ? ' none' : '') }, lv));
    if (f.notes[r.id]) td.appendChild(h('div', { class: 'small' }, f.notes[r.id]));
    tr.appendChild(td); tb.appendChild(tr);
  });
  p.appendChild(tb);
  const cons = linkEls.filter((l) => l.a === f.id || l.b === f.id);
  p.appendChild(h('h3', {}, `Connections (${cons.length})`));
  const ul = h('ul', { class: 'conn' });
  cons.forEach((l) => {
    const o = byId.get(l.a === f.id ? l.b : l.a), li = h('li'), b = h('button');
    b.appendChild(document.createTextNode(`${o.id} ${o.name} `)); b.appendChild(tag(o.status)); b.appendChild(h('small', {}, l.t));
    b.onclick = () => { if (!state.st[o.status]) return; state.sel = o.id; refresh(); if (!document.body.classList.contains('listmode')) zoomTo(o.x, o.y, 420); };
    li.appendChild(b); ul.appendChild(li);
  });
  if (!cons.length) p.appendChild(h('p', { class: 'small' }, 'None recorded.')); else p.appendChild(ul);
  const back = h('button', {}, 'Close'); back.onclick = () => { state.sel = null; refresh(); }; p.appendChild(h('p')).appendChild(back);
}

fit(); refresh();
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth !== lastW && !document.body.classList.contains('listmode')) { lastW = window.innerWidth; fit(); } });
</script>
</body>
</html>
