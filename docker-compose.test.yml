# Local end-to-end testing only: `docker compose -f docker-compose.yml -f docker-compose.test.yml up`.
# Adds Mailpit as the SMTP sink (web UI on http://localhost:8025) so the mail
# job really sends, and nothing leaves the machine.
services:
  mailpit:
    image: axllent/mailpit:v1.32
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  mail:
    environment:
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      mailpit: { condition: service_started }
  # PDF exports for the web app run outside Docker (npm run walkthrough):
  # the same renderer and flags as "pdf", with a port on this machine only.
  pdf-local:
    image: gotenberg/gotenberg:8.38.1-chromium
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-public-ips=true
      - --chromium-deny-private-ips=true
      - --chromium-max-queue-size=10
      - --api-disable-download-from=true
      - --webhook-disable=true
      - --pdfengines-disable-routes=true
      - --prometheus-disable-collect=true
      - --api-timeout=60s
      - --log-level=warn
    ports: ["127.0.0.1:3001:3000"]
  # Sample data: `docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm seed`
  seed:
    profiles: ["seed"]
    build: { context: ./apps/web, target: tools }
    command: ["npm", "run", "db:seed"]
    environment:
      NODE_ENV: development
      SEED_PASSWORD: ${SEED_PASSWORD:?set in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_OWNER_URL: postgres://selah_owner:${SELAH_OWNER_PASSWORD}@db:5432/selah
      DATABASE_APP_URL: postgres://selah_app:${SELAH_APP_PASSWORD}@db:5432/selah
      DATABASE_AUTH_URL: postgres://selah_auth:${SELAH_AUTH_PASSWORD}@db:5432/selah
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-selah-evidence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    depends_on:
      setup: { condition: service_completed_successfully }
